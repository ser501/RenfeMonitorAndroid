name: Build OndaLibre APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'OndaLibre/**'
      - '.github/workflows/build-ondalibre.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct OndaLibre source if needed
        shell: bash
        run: |
          if [ ! -f OndaLibre/app/build.gradle.kts ]; then
            cat OndaLibreBundle/chunk*.b64 | base64 --decode > /tmp/OndaLibre_Proyecto_Android.zip
            unzip -t /tmp/OndaLibre_Proyecto_Android.zip
            mkdir -p /tmp/ondalibre-src
            unzip -oq /tmp/OndaLibre_Proyecto_Android.zip -d /tmp/ondalibre-src
            cp -a /tmp/ondalibre-src/OndaLibre/. OndaLibre/
          else
            echo "La fuente de OndaLibre ya está versionada; no hace falta reconstruir el ZIP."
          fi
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build OndaLibre
        working-directory: OndaLibre
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OndaLibre-debug-apk
          path: OndaLibre/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish source files and remove bootstrap bundle
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OndaLibre
          if [ -d OndaLibreBundle ]; then
            git rm -r OndaLibreBundle
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish OndaLibre Android project source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No hay cambios de fuente que publicar."
          fi
